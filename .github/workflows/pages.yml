name: Deploy Candlelight
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candlelight-verified-pages-v2
  cancel-in-progress: true
jobs:
  build:
    # Playwright 1.56 browsers have official dependency support on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint
      - run: pnpm run test:paper
      - name: Verify market ingestion recovery tests
        run: node --test services/ingest-worker/protocol.test.mjs services/ingest-worker/store.test.mjs
      - name: Check standalone worker syntax
        run: |
          node --check services/ingest-worker/store.mjs
          node --check services/ingest-worker/runner.mjs
      - run: pnpm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_BUILD_SHA: ${{ github.sha }}
      - name: Stamp published commit into Pages manifest
        run: printf '{"sha":"%s"}\n' "$GITHUB_SHA" > dist/version.json
      - name: Install browser test dependencies
        run: npm install --prefix tests/e2e --no-package-lock --ignore-scripts
      - name: Install cross-browser engines and required system libraries
        run: cd tests/e2e && npx playwright install --with-deps chromium firefox webkit
      - name: Exercise workspace controls in Chrome, Firefox, WebKit and mobile smoke
        run: cd tests/e2e && npm test
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
